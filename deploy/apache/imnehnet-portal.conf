# IMNEHNET portal - Apache vhost
#
# This file is NOT active. It has to be installed by a human with sudo,
# because /etc/apache2 is root-owned and the portal must not edit it itself.
#
# What it does, and why each part is here:
#
#   1. Serves the portal from this application's public/ directory through
#      php-fpm. The portal is currently served by "php artisan serve", which is
#      PHP's built-in development server: single threaded, no WebSocket support,
#      and it does not come back after a reboot. Apache with php-fpm is what
#      should be serving it anyway.
#
#   2. Proxies /terminal/<slot>/ to a ttyd listener on loopback. ttyd speaks
#      WebSocket, and WebSocket is an HTTP upgrade, so it cannot be forwarded by
#      an ordinary reverse proxy. mod_proxy_wstunnel exists for exactly this and
#      has to be enabled; without it the terminal page loads and then hangs.
#
# Why slots instead of one port per session:
#
#   A ttyd process serves exactly one shell, so every session needs its own
#   listener. Apache resolves ProxyPass targets statically and cannot look a port
#   up in the portal's database, so the ports have to be declared here in
#   advance. Each slot is a fixed port the portal lends out. The number of slots
#   below is therefore the number of terminals that can exist at once; raising
#   it means adding lines here as well as in the portal's configuration, and
#   the two must agree.
#
# Why there is an htpasswd per slot:
#
#   Apache cannot ask the portal whether a token is still valid on a WebSocket
#   upgrade, because the upgrade leaves HTTP and never returns a response the
#   portal could have signed. So each slot is protected by ordinary HTTP basic
#   auth instead, and the portal rewrites that slot's password file when a
#   session starts and deletes it when the session ends. With no file present
#   there is no valid user, so a slot nobody has leased cannot be used.
#
#   This does not replace ttyd's own credential. Both are checked; they are two
#   independent gates rather than one, and either alone would be a weaker
#   arrangement.

<VirtualHost *:80>
    ServerName 192.168.100.10
    ServerAdmin webmaster@localhost

    DocumentRoot /home/iaas/projects/webportal-iaas/public

    # The leased terminal slots, as "port token" lines, written by the portal.
    #
    # Apache cannot ask the portal whether a terminal token is valid. A browser
    # reaching a terminal upgrades to a WebSocket, which leaves HTTP and never
    # returns a response the portal could have signed, and the page load is
    # proxied rather than routed for the same reason. So the portal writes the
    # answer down and Apache reads it.
    #
    # A port with no line matches nothing, which is what makes an unleased slot
    # unreachable rather than merely unused. The NONE default is what does that:
    # a missing entry compares as NONE, which never equals a real token, so the
    # allow rule below fails and the refusal rule takes over.
    RewriteMap imnehnet_slots txt:/var/lib/imnehnet/terminal/slots.map

    <Directory /home/iaas/projects/webportal-iaas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Everything Laravel serves is routed by its own front controller, so any
    # path that is not a real file on disk has to be handed to index.php.
    # Without these rules Apache answers 404 for /up and /admin/login, because
    # those names do not exist on disk, and the failure looks like a broken
    # application rather than a missing rewrite.
    RewriteEngine On

    # The terminal gate comes before every other rule. This is not a preference:
    # the rule that keeps terminal paths out of the application's routing also
    # stops rewrite processing with [L], so if it came first it would consume
    # every terminal request and the token check below would never run. An
    # earlier version had it in that order, and every request to a slot was
    # proxied straight through to the shell with no token at all.
    #
    # A terminal request must carry the exact token the portal issued for that
    # slot. Matching here is the only thing that decides between proxying a
    # request to a shell and refusing it.
    RewriteCond %{REQUEST_URI} ^/terminal/ [NC]
    RewriteCond %{QUERY_STRING} (?:^|&)t=([0-9a-f]{32,64})(?:&|$)
    RewriteCond %{imnehnet_slots:%1|NONE} =%2
    RewriteRule ^ - [L]

    # Anything else under /terminal/ is refused here: an unleased slot, a wrong
    # token, or a request with no token at all. Refusing before the routing rules
    # below also stops a terminal path falling through to index.php, which would
    # hand the browser the portal instead of a shell.
    RewriteCond %{REQUEST_URI} ^/terminal/ [NC]
    RewriteRule ^ - [F]

    # Ordinary application routing: hand anything that is not a real file to the
    # front controller.
    #
    # This is FallbackResource rather than the usual
    #
    #     RewriteCond %{REQUEST_FILENAME} !-f
    #     RewriteCond %{REQUEST_FILENAME} !-d
    #     RewriteRule ^ index.php [L]
    #
    # because in a VirtualHost that pattern rewrote every request to index.php,
    # static files included. %REQUEST_FILENAME% is not reliably the filesystem
    # path when a server-context rewrite runs, so the -f test was always true and
    # every stylesheet and script was handed to Laravel, which answered 404 for
    # them. The page rendered with no styling at all and the only symptom was the
    # assets returning a not-found page, which reads as a build problem rather
    # than a server configuration one.
    #
    # FallbackResource is core, needs no module, and is consulted only after the
    # document root has been walked, so a file that exists is served and only
    # everything else falls through. It cannot swallow a terminal either: a
    # terminal path is either refused by the rules above or proxied by its
    # Location block, and neither of those is a fallback.
    FallbackResource /index.php

    # These headers have to survive being handed to PHP. Livewire and Sanctum
    # read them as CGI variables, and Apache drops them from the environment
    # unless they are re-exported, which shows up as a session that authenticates
    # and then mysteriously loses its state on the next request.
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{HTTP:X-XSRF-Token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

    # .json is deliberately not in this list. The only two JSON files under the
    # document root are Vite build outputs, manifest.json and fonts-manifest.json,
    # and denying them made the asset manifest unreachable, so every built asset
    # was requested as a path the application could not resolve and the portal
    # rendered unstyled.
    <FilesMatch "\.(env|log|ini|lock|md|sql|sh|sqlite|ya?ml)$">
        Require all denied
    </FilesMatch>

    # proxy_fcgi is what executes PHP. mod_proxy alone is not enough: it handles
    # ordinary HTTP forwarding, and this directive needs the FastCGI half of the
    # module. Without it the SetHandler below names a handler that does not
    # exist and Apache serves the .php file as plain text instead of running it,
    # which publishes the application's source code to anyone who requests it.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/imnehnet-error.log
    CustomLog ${APACHE_LOG_DIR}/imnehnet-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Terminal slots. PORT must be kept in step with
# infrastructure.terminal.port_range_min / _max in config/infrastructure.php.
#
# No authentication lives here. The rules above it decide whether a terminal
# request is allowed at all, from the token the portal issued for that slot.
# Repeating the check here would mean a second password prompt per page load,
# which is the thing the token exists to avoid.
# ---------------------------------------------------------------------------

<Location /terminal/38000/>
    ProxyPass        http://127.0.0.1:38000/
    ProxyPassReverse http://127.0.0.1:38000/
</Location>

<Location /terminal/38001/>
    ProxyPass        http://127.0.0.1:38001/
    ProxyPassReverse http://127.0.0.1:38001/
</Location>

<Location /terminal/38002/>
    ProxyPass        http://127.0.0.1:38002/
    ProxyPassReverse http://127.0.0.1:38002/
</Location>

<Location /terminal/38003/>
    ProxyPass        http://127.0.0.1:38003/
    ProxyPassReverse http://127.0.0.1:38003/
</Location>

<Location /terminal/38004/>
    ProxyPass        http://127.0.0.1:38004/
    ProxyPassReverse http://127.0.0.1:38004/
</Location>

<Location /terminal/38005/>
    ProxyPass        http://127.0.0.1:38005/
    ProxyPassReverse http://127.0.0.1:38005/
</Location>

<Location /terminal/38006/>
    ProxyPass        http://127.0.0.1:38006/
    ProxyPassReverse http://127.0.0.1:38006/
</Location>

<Location /terminal/38007/>
    ProxyPass        http://127.0.0.1:38007/
    ProxyPassReverse http://127.0.0.1:38007/
</Location>