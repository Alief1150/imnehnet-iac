# IMNEHNET portal - Apache vhost
#
# This file is NOT active. It has to be installed by a human with sudo,
# because /etc/apache2 is root-owned and the portal must not edit it itself.
#
# What it does, and why each part is here:
#
#   1. Serves the portal from this application's public/ directory through
#      php-fpm. The portal is currently served by "php artisan serve", which is
#      PHP's built-in development server: single threaded, no WebSocket support,
#      and it does not come back after a reboot. Apache with php-fpm is what
#      should be serving it anyway.
#
#   2. Proxies /terminal/<slot>/ to a ttyd listener on loopback. ttyd speaks
#      WebSocket, and WebSocket is an HTTP upgrade, so it cannot be forwarded by
#      an ordinary reverse proxy. mod_proxy_wstunnel exists for exactly this and
#      has to be enabled; without it the terminal page loads and then hangs.
#
# Why slots instead of one port per session:
#
#   A ttyd process serves exactly one shell, so every session needs its own
#   listener. Apache resolves ProxyPass targets statically and cannot look a port
#   up in the portal's database, so the ports have to be declared here in
#   advance. Each slot is a fixed port the portal lends out. The number of slots
#   below is therefore the number of terminals that can exist at once; raising
#   it means adding lines here as well as in the portal's configuration, and
#   the two must agree.
#
# Why there is an htpasswd per slot:
#
#   Apache cannot ask the portal whether a token is still valid on a WebSocket
#   upgrade, because the upgrade leaves HTTP and never returns a response the
#   portal could have signed. So each slot is protected by ordinary HTTP basic
#   auth instead, and the portal rewrites that slot's password file when a
#   session starts and deletes it when the session ends. With no file present
#   there is no valid user, so a slot nobody has leased cannot be used.
#
#   This does not replace ttyd's own credential. Both are checked; they are two
#   independent gates rather than one, and either alone would be a weaker
#   arrangement.

<VirtualHost *:80>
    ServerName 192.168.100.10
    ServerAdmin webmaster@localhost

    DocumentRoot /home/iaas/projects/webportal-iaas/public

    <Directory /home/iaas/projects/webportal-iaas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Everything Laravel serves is routed by its own front controller, so any
    # path that is not a real file on disk has to be handed to index.php.
    # Without these rules Apache answers 404 for /up and /admin/login, because
    # those names do not exist on disk, and the failure looks like a broken
    # application rather than a missing rewrite.
    RewriteEngine On

    # The terminal is proxied, not routed. A slot has no file behind it, so
    # without this exclusion every terminal request would be rewritten to
    # index.php and the browser would be handed the portal instead of a shell.
    RewriteCond %{REQUEST_URI} ^/terminal/ [NC]
    RewriteRule ^ - [L]

    # These headers have to survive the rewrite. Livewire and Sanctum read them
    # as CGI variables, and Apache drops them from the environment unless they
    # are re-exported, which shows up as a session that authenticates and then
    # mysteriously loses its state on the next request.
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{HTTP:X-XSRF-Token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [L]

    <FilesMatch "\.(env|log|ini|json|lock|md|sql|sh|sqlite|ya?ml)$">
        Require all denied
    </FilesMatch>

    # proxy_fcgi is what executes PHP. mod_proxy alone is not enough: it handles
    # ordinary HTTP forwarding, and this directive needs the FastCGI half of the
    # module. Without it the SetHandler below names a handler that does not
    # exist and Apache serves the .php file as plain text instead of running it,
    # which publishes the application's source code to anyone who requests it.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/imnehnet-error.log
    CustomLog ${APACHE_LOG_DIR}/imnehnet-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Terminal slots. PORT must be kept in step with
# infrastructure.terminal.port_range_min / _max in config/infrastructure.php.
# ---------------------------------------------------------------------------

<Location /terminal/38000/>
    ProxyPass        http://127.0.0.1:38000/
    ProxyPassReverse http://127.0.0.1:38000/
    AuthType Basic
    AuthName "IMNEHNET Terminal"
    AuthUserFile /var/lib/imnehnet/terminal/38000.htpasswd
    Require valid-user
</Location>

