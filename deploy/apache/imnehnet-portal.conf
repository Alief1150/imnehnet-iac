# IMNEHNET portal - Apache vhost
#
# This file is NOT active. It has to be installed by a human with sudo,
# because /etc/apache2 is root-owned and the portal must not edit it itself.
#
# What it does, and why each part is here:
#
#   1. Serves the portal from this application's public/ directory through
#      php-fpm. The portal is currently served by "php artisan serve", which is
#      PHP's built-in development server: single threaded, no WebSocket support,
#      and it does not come back after a reboot. Apache with php-fpm is what
#      should be serving it anyway.
#
#   2. Proxies /terminal/<slot>/ and /embed/<slot>/ to a ttyd listener on
#      loopback. ttyd speaks WebSocket, and WebSocket is an HTTP upgrade, so it
#      cannot be forwarded by an ordinary reverse proxy. mod_proxy_wstunnel
#      exists for exactly this and has to be enabled; without it the terminal
#      page loads and then hangs. /terminal/ asks the browser for the slot's
#      password; /embed/ takes the slot's ticket from a cookie, which is what
#      the embedded frame uses.
#
# Why slots instead of one port per session:
#
#   A ttyd process serves exactly one shell, so every session needs its own
#   listener. Apache resolves ProxyPass targets statically and cannot look a port
#   up in the portal's database, so the ports have to be declared here in
#   advance. Each slot is a fixed port the portal lends out. The number of slots
#   below is therefore the number of terminals that can exist at once; raising
#   it means adding lines here as well as in the portal's configuration, and
#   the two must agree.
#
# Why there is an htpasswd per slot:
#
#   Apache cannot ask the portal whether a token is still valid on a WebSocket
#   upgrade, because the upgrade leaves HTTP and never returns a response the
#   portal could have signed. So each slot is protected by ordinary HTTP basic
#   auth instead, and the portal rewrites that slot's password file when a
#   session starts and deletes it when the session ends. With no file present
#   there is no valid user, so a slot nobody has leased cannot be used.
#
#   This is the only gate. ttyd itself runs with no credential of its own, so
#   the password file is not a second lock but the lock.

<VirtualHost *:80>
    ServerName 192.168.100.10
    ServerAdmin webmaster@localhost

    DocumentRoot /home/iaas/projects/webportal-iaas/public

    # No RewriteMap here. One used to map "port token" lines from a single file, and
    # it cannot work: a txt: map is read when the server starts, so a slot leased
    # after that is never in it. Leases are files tested per request instead, below.

    <Directory /home/iaas/projects/webportal-iaas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Everything Laravel serves is routed by its own front controller, so any
    # path that is not a real file on disk has to be handed to index.php.
    # Without these rules Apache answers 404 for /up and /admin/login, because
    # those names do not exist on disk, and the failure looks like a broken
    # application rather than a missing rewrite.
    RewriteEngine On

    # The terminal gates come before every other rule. This is not a preference:
    # the rule that keeps terminal paths out of the application's routing also
    # stops rewrite processing with [L], so if it came first it would consume
    # every terminal request and the checks below would never run. An earlier
    # version had it in that order, and every request to a slot was proxied
    # straight through to the shell with nothing checked at all.
    #
    # A terminal request is allowed only for a slot that is leased, and a leased
    # slot is a file. Apache tests for the file on every request, so a slot
    # becomes reachable the moment the portal writes it and unreachable the moment
    # the portal deletes it.
    #
    # This replaced a RewriteMap over one "port token" file, which cannot work and
    # did not: a txt: map is read when the server starts, so a slot leased after
    # that is never in it, and the lookup was keyed by a backreference, so every
    # lookup returned NONE and every request was refused — a correct token
    # included. Removing only the map condition, with the capture conditions left
    # alone, answered 503 rather than 403, which placed the fault on the lookup and
    # nowhere else.
    #
    # The credential is checked in the Location blocks with Require valid-user
    # against the same file, not carried in the query string. That is deliberate:
    # Apache cannot ask the portal whether a token is still valid once a browser
    # upgrades to a WebSocket, because that leaves HTTP and never returns a
    # response the portal could have signed. It also means nothing secret is
    # written to this site's access log.
    #
    # A WebSocket upgrade is a different scheme and needs its own proxy target.
    # ProxyPass http:// serves the page but answers an upgrade with the page
    # again — measured on this host: the handshake came back 200 instead of 101,
    # a terminal that loads and never connects. So an upgrade to a leased slot
    # is proxied to ws:// explicitly, before the rule below passes the slot
    # through to its Location block. The block's Require still applies: the URI
    # is unchanged, so authorisation answers 401 to an upgrade with no credential
    # exactly as it does to a page load. Verified live, in both directions.
    RewriteCond %{HTTP:Upgrade} ^websocket$ [NC]
    RewriteCond %{REQUEST_URI} ^/terminal/([0-9]+)/ [NC]
    RewriteCond /var/lib/imnehnet/terminal/htpasswd/%1 -f
    RewriteRule ^/terminal/([0-9]+)/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

    RewriteCond %{REQUEST_URI} ^/terminal/([0-9]+)/ [NC]
    RewriteCond /var/lib/imnehnet/terminal/htpasswd/%1 -f
    RewriteRule ^ - [L]

    # Anything else under /terminal/ is refused here: an unleased slot, or a
    # request with no credential at all. Refusing before the routing rules
    # below also stops a terminal path falling through to index.php, which would
    # hand the browser the portal instead of a shell.
    RewriteCond %{REQUEST_URI} ^/terminal/ [NC]
    RewriteRule ^ - [F]

    # The embedded console, /embed/<port>/.
    #
    # The frame cannot send an Authorization header — there is no attribute for
    # it — so there is no password prompt to answer from inside it. Instead the
    # browser carries the slot's ticket in a cookie (imnehnet_slot_<port>), queued
    # when the session opened, and the vhost requires two things together: the
    # cookie must name a ticket, and a file <port>-<ticket> must exist in the
    # embed directory. Either alone opens nothing: a ticket for another slot names
    # a file that is not this slot's, and a forged cookie names a file that does
    # not exist. %1 is the port from the address, %3 the ticket from the cookie,
    # and the \1 backreference is what binds them to each other.
    #
    # The ticket is deliberately not in the address. A query string would be
    # copied into the access log, into browser history and into the Referer of
    # anything the frame loads; a cookie is written to none of those. The file's
    # existence is still the lease: closing the session deletes it, and every
    # request after that — page, asset or websocket — is refused with no reload.
    RewriteCond %{HTTP:Upgrade} ^websocket$ [NC]
    RewriteCond %{REQUEST_URI}::%{HTTP_COOKIE} ^/embed/([0-9]+)/::(.*;\s*|)imnehnet_slot_\1=([0-9a-f]+)(;|$) [NC]
    RewriteCond /var/lib/imnehnet/terminal/embed/%1-%3 -f
    RewriteRule ^/embed/([0-9]+)/(.*)$ ws://127.0.0.1:$1/$2 [P,L]

    RewriteCond %{REQUEST_URI}::%{HTTP_COOKIE} ^/embed/([0-9]+)/::(.*;\s*|)imnehnet_slot_\1=([0-9a-f]+)(;|$) [NC]
    RewriteCond /var/lib/imnehnet/terminal/embed/%1-%3 -f
    RewriteRule ^/embed/([0-9]+)/(.*)$ http://127.0.0.1:$1/$2 [P,L]

    # Anything else under /embed/ is refused here: no ticket cookie, a ticket for
    # another slot, or a slot whose lease is gone. As with /terminal/, refusing
    # before the routing rules also stops an embed path falling through to
    # index.php, which would hand the browser the portal instead of a shell.
    RewriteCond %{REQUEST_URI} ^/embed/ [NC]
    RewriteRule ^ - [F]

    # Ordinary application routing: hand anything that is not a real file to the
    # front controller.
    #
    # This is FallbackResource rather than the usual
    #
    #     RewriteCond %{REQUEST_FILENAME} !-f
    #     RewriteCond %{REQUEST_FILENAME} !-d
    #     RewriteRule ^ index.php [L]
    #
    # because in a VirtualHost that pattern rewrote every request to index.php,
    # static files included. %REQUEST_FILENAME% is not reliably the filesystem
    # path when a server-context rewrite runs, so the -f test was always true and
    # every stylesheet and script was handed to Laravel, which answered 404 for
    # them. The page rendered with no styling at all and the only symptom was the
    # assets returning a not-found page, which reads as a build problem rather
    # than a server configuration one.
    #
    # FallbackResource is core, needs no module, and is consulted only after the
    # document root has been walked, so a file that exists is served and only
    # everything else falls through. It cannot swallow a terminal either: a
    # terminal path is either refused by the rules above or proxied by its
    # Location block, and neither of those is a fallback.
    FallbackResource /index.php

    # These headers have to survive being handed to PHP. Livewire and Sanctum
    # read them as CGI variables, and Apache drops them from the environment
    # unless they are re-exported, which shows up as a session that authenticates
    # and then mysteriously loses its state on the next request.
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{HTTP:X-XSRF-Token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

    # .json is deliberately not in this list. The only two JSON files under the
    # document root are Vite build outputs, manifest.json and fonts-manifest.json,
    # and denying them made the asset manifest unreachable, so every built asset
    # was requested as a path the application could not resolve and the portal
    # rendered unstyled.
    <FilesMatch "\.(env|log|ini|lock|md|sql|sh|sqlite|ya?ml)$">
        Require all denied
    </FilesMatch>

    # proxy_fcgi is what executes PHP. mod_proxy alone is not enough: it handles
    # ordinary HTTP forwarding, and this directive needs the FastCGI half of the
    # module. Without it the SetHandler below names a handler that does not
    # exist and Apache serves the .php file as plain text instead of running it,
    # which publishes the application's source code to anyone who requests it.
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/imnehnet-error.log
    CustomLog ${APACHE_LOG_DIR}/imnehnet-access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# Terminal slots. PORT must be kept in step with
# infrastructure.terminal.port_range_min / _max in config/infrastructure.php.
#
# The direct path: each slot asks the browser for its password, checked here
# against the file the portal wrote when the session opened. The embedded path
# needs no block here — its gate is the rewrite rules above, tested per request
# against the ticket files.
# ---------------------------------------------------------------------------

<Location /terminal/38000/>
    AuthType Basic
    AuthName "IMNEHNET terminal"
    AuthUserFile /var/lib/imnehnet/terminal/htpasswd/38000
    Require valid-user
    ProxyPass        http://127.0.0.1:38000/
    ProxyPassReverse http://127.0.0.1:38000/
</Location>

