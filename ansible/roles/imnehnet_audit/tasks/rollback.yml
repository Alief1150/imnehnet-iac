---
- name: Remove IMNEHNET audit hook from SSH rc
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshrc
    marker: "# {mark} IMNEHNET AUDIT"
    state: absent
    backup: true

- name: Remove IMNEHNET audit SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/90-imnehnet-audit.conf
    state: absent
  notify: Validate and reload ssh

- name: Remove IMNEHNET audit rules
  ansible.builtin.file:
    path: /etc/audit/rules.d/90-imnehnet.rules
    state: absent
  notify: Load audit rules

- name: Remove narrow reporter sudoers rule
  ansible.builtin.file:
    path: /etc/sudoers.d/imnehnet-audit-report
    state: absent

- name: Remove installed IMNEHNET audit scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/imnehnet-session-audit
    - /usr/local/sbin/imnehnet-audit-report

- name: Remove IMNEHNET audit configuration directory
  ansible.builtin.file:
    path: /etc/imnehnet-audit
    state: absent

- name: Validate SSH configuration after rollback
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply rollback handlers
  ansible.builtin.meta: flush_handlers
